<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú · Bakery Bites</title>
<meta name="theme-color" content="#FBF8F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* SRF: vino con mostaza (también la pantalla de elegir sede) */
    --bg:#FBF8F2; --ink:#2B2627; --muted:#736B6C; --line:#EADFD8;
    --accent:#7A1F2E; --gold:#D9A63E; --dark:#5E1724; --dark-ink:#FBF1EC;
    --card:#FFFFFF;
  }
  /* SBD: carbón con mostaza */
  html.sbd{
    --bg:#FFFDF8; --ink:#2B2627; --muted:#6F6767; --line:#E8E3E6;
    --accent:#9A4A1F; --gold:#D9A63E; --dark:#2E2A2B; --dark-ink:#FBF6EC;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Poppins",system-ui,sans-serif;overflow-x:hidden}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px}
  h1,h2,.anton{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.04em}
  header{padding:28px 0 12px;text-align:center}
  header h1{font-size:44px;line-height:1;margin:0}
  .sede{margin:8px 0 0;color:var(--muted);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:14px}
  .sede a{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
  .aviso{background:#efe0c8;border-radius:10px;padding:8px 12px;font-size:14px;text-align:center;margin:8px 0}
  .destacado{background:var(--dark);color:var(--dark-ink);border-radius:14px;padding:16px 18px;margin:12px 0 4px}
  .destacado .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .destacado h2{font-size:24px;line-height:1.1;margin:4px 0 4px}
  .destacado p{margin:0 0 8px;opacity:.9;font-size:14px}
  .destacado .p{font-weight:600;font-size:18px;color:var(--gold)}
  .destacado{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
  .dst-track{display:grid}
  .dst-slide{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s}
  .dst-slide.on{opacity:1;visibility:visible}
  .dots{display:flex;justify-content:center;gap:4px;margin:6px 0 -8px}
  .dots button{width:20px;height:20px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .dots button::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s}
  .dots button.on::before{background:var(--gold)}
  @media (prefers-reduced-motion:reduce){.dst-slide,.dots button::before{transition:none}}
  .chips{display:flex;gap:6px;margin:14px -18px 2px;padding:0 18px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{font:inherit;font-size:13px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 11px 5px 6px;cursor:pointer;flex:none;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:10px -18px 0;padding:0 18px}
  nav .scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav .scroll::-webkit-scrollbar{display:none}
  nav a{flex:none;padding:12px 10px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
  nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
  section{scroll-margin-top:56px;padding-top:22px}
  section h2{font-size:26px;margin:0 0 6px;text-transform:uppercase}
  .sizes,.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:baseline}
  .sizes{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 0 4px;border-bottom:1px solid var(--line)}
  .prices{display:grid;grid-auto-flow:column;grid-template-columns:repeat(var(--n,1),4.6rem);gap:0 6px;text-align:right}
  .sizes.unico{margin-top:14px}
  .item+.sizes{margin-top:14px}
  h3.sub{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 4px}
  h2+h3.sub{margin-top:4px}
  .sizes small{display:block;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.85}
  .adi{display:flex;align-items:baseline;padding:5px 0;font-size:15px}
  .adi .lead{flex:1;min-width:16px;border-bottom:2px dotted var(--line);margin:0 8px;transform:translateY(-4px)}
  .adic h2{font-size:22px}
  .prices span{white-space:nowrap}
  .item{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .item:last-child{border-bottom:0}
  .name{font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
  .ic{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-size:9px;font-weight:600;letter-spacing:0;line-height:1;position:relative;cursor:help;flex:none}
  .grp{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .mas{color:var(--muted);font-size:13px;font-weight:400;transition:transform .2s}
  .item.open .mas{transform:rotate(45deg)}
  .desc{grid-column:1/-1;color:var(--muted);font-size:14px;max-height:0;overflow:hidden;transition:max-height .25s ease,margin .25s ease}
  .item.open .desc{max-height:12em;margin-top:4px}
  .tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:9;pointer-events:none}
  .tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
  .chip .ic{width:18px;height:18px;font-size:8px;margin-right:5px;border-color:currentColor;color:inherit}
  .chip{display:inline-flex;align-items:center}
  .price{font-weight:600;white-space:nowrap}
  .vacio{text-align:center;color:var(--muted);padding:30px 0}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 36px}
  .elegir{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
  .elegir h1{font-size:52px;margin:0}
  .elegir p{margin:0 0 10px;color:var(--muted)}
  .btn{display:block;padding:18px;border-radius:14px;background:var(--dark);color:var(--dark-ink);text-decoration:none;font-size:18px;font-weight:600}
  .btn small{display:block;font-weight:400;opacity:.75;font-size:13px}
  @media (min-width:700px){header h1{font-size:60px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="vacio">Cargando menú…</p></div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTp8NAlDAtePXBoBUVZxfjFqbi_hXARsljXux5icyXhAOeQrG0C6I_nvooKoxvUnbT_TcJND1em_3HT/pub?gid=405048610&single=true&output=csv';
const SEDES = { SRF: 'San Rafael', SBD: 'Santa Bárbara' };
const ETQ = { MM: 'Masa madre', SG: 'Sin gluten', SA: 'Sin azúcar' };
const CACHE_KEY = 'bb_menu_csv';
const OZ = { Peq: '7 oz', Med: '9 oz', Gr: '12 oz' };
const app = document.getElementById('app');

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim() !== ''))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const precio = n => n < 1000 ? '$' + n : '$' + String(Math.round(n / 10) / 100).replace('.', ',') + 'K';
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');

function elegirSede() {
  document.title = 'Menú · Bakery Bites';
  app.innerHTML = `<div class="elegir"><h1>BAKERY BITES</h1><p>¿En qué sede estás?</p>` +
    Object.entries(SEDES).map(([k, v]) => `<a class="btn" href="?sede=${k.toLowerCase()}">${v}<small>Centro Comercial ${v}</small></a>`).join('') +
    `</div>`;
}

async function cargar() {
  try {
    const r = await fetch(CSV_URL, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    if (!/sede/i.test(text.slice(0, 200))) throw new Error('CSV inválido');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), text })); } catch (e) {}
    return { text };
  } catch (e) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e2) {}
    if (c && c.text) {
      const d = new Date(c.t);
      return { text: c.text, aviso: `Precios del ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}` };
    }
    return null;
  }
}

function agrupar(rows, sede) {
  const cats = new Map();
  rows.forEach((r, fila) => {
    if (r.sede.toUpperCase() !== sede) return;
    const p = parseInt(String(r.precio).replace(/\D/g, ''), 10);
    if (!p) return;
    const cat = r.categoria_menu || 'Otros';
    const orden = parseFloat(r.orden); const o = isNaN(orden) ? 9999 : orden;
    if (!cats.has(cat)) cats.set(cat, { nombre: cat, orden: o, items: new Map(), ov: new Map() });
    const C = cats.get(cat); C.orden = Math.min(C.orden, o);
    const key = r.nombre_menu.toLowerCase();
    if (!C.items.has(key)) C.items.set(key, {
      nombre: r.nombre_menu, desc: r.descripcion, orden: o, fila, uid: slug(cat) + '--' + slug(key),
      tags: (r.etiquetas || '').split(',').map(t => t.trim().toUpperCase()).filter(t => ETQ[t]),
      destacado: /^s[ií]$/i.test(r.destacado), sub: r.subtitulo || '', precios: []
    });
    const it = C.items.get(key); it.orden = Math.min(it.orden, o);
    if (/^s[ií]$/i.test(r.destacado)) it.destacado = true;
    it.precios.push({ tamano: r.tamano, precio: p });
    if (r.tamano) {
      const ov = parseFloat(r.orden_variante);
      if (!isNaN(ov)) C.ov.set(r.tamano, Math.min(C.ov.get(r.tamano) ?? ov, ov));
    }
  });
  const esAdic = n => slug(n) === 'adiciones';
  const lista = [...cats.values()].sort((a, b) => (esAdic(a.nombre) - esAdic(b.nombre)) || (a.orden - b.orden));
  return lista.map(c => {
    // Variantes: orden_variante → número del tamaño (9 oz) → alfabético
    const cmp = (a, b) => {
      const oa = c.ov.get(a), ob = c.ov.get(b);
      if (oa != null || ob != null) return oa == null ? 1 : ob == null ? -1 : oa - ob;
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) || !isNaN(nb)) return isNaN(na) ? 1 : isNaN(nb) ? -1 : na - nb;
      return a.localeCompare(b, 'es');
    };
    const items = [...c.items.values()].sort((a, b) => a.orden - b.orden);
    items.forEach(i => i.precios.sort((a, b) => cmp(a.tamano, b.tamano)));
    return { nombre: c.nombre, id: 'c-' + slug(c.nombre), items, cmp, adic: esAdic(c.nombre) };
  });
}

const icono = t => `<span class="ic" tabindex="0" role="button" data-tip="${ETQ[t]}" aria-label="${ETQ[t]}">${t}</span>`;
function itemHTML(it, tams) {
  let pr;
  if (tams.length && it.precios.some(p => p.tamano)) {
    pr = `<div class="prices" style="--n:${tams.length}">` +
      tams.map(t => { const p = it.precios.find(x => x.tamano === t); return `<span class="price">${p ? precio(p.precio) : '—'}</span>`; }).join('') + `</div>`;
  } else {
    pr = `<span class="price">${precio(it.precios[0].precio)}</span>`;
  }
  return `<div class="item" data-uid="${it.uid}"><div class="name">${esc(it.nombre)}` +
    ((it.tags.length || it.desc) ? `<span class="grp">${it.tags.map(icono).join('')}${it.desc ? `<span class="mas" aria-hidden="true">＋</span>` : ''}</span>` : '') + `</div>${pr}` +
    (it.desc ? `<div class="desc">${esc(it.desc)}</div>` : '') +
    `</div>`;
}

// Agrupa los productos con tamaños en bloques que comparten tamaños (Peq/Med/Gr aparte de Sencillo/Doble); cada bloque con su encabezado.
function bloque(items, cmp, oz) {
  const conVar = items.filter(i => i.precios.some(p => p.tamano));
  if (!conVar.length) return items.map(i => itemHTML(i, [])).join('');
  const grupos = [];
  conVar.forEach(i => {
    const ts = i.precios.map(p => p.tamano).filter(Boolean);
    const unidos = grupos.filter(g => ts.some(t => g.tams.has(t)));
    const g = { items: [i], tams: new Set(ts) };
    unidos.forEach(u => { u.items.forEach(x => g.items.push(x)); u.tams.forEach(t => g.tams.add(t)); grupos.splice(grupos.indexOf(u), 1); });
    grupos.push(g);
  });
  grupos.forEach(g => g.items.sort((a, b) => items.indexOf(a) - items.indexOf(b)));
  grupos.sort((a, b) => items.indexOf(a.items[0]) - items.indexOf(b.items[0]));
  const unicos = items.filter(i => !conVar.includes(i));
  return grupos.map(g => {
    const tams = [...g.tams].sort(cmp);
    return `<div class="sizes"><span></span><div class="prices" style="--n:${tams.length}">${tams.map(t => `<span>${esc(t)}${oz && oz[t] ? `<small>${oz[t]}</small>` : ''}</span>`).join('')}</div></div>` +
      g.items.map(i => itemHTML(i, tams)).join('');
  }).join('') +
    (unicos.length ? `<div class="sizes unico"><span>Precio único</span></div>` + unicos.map(i => itemHTML(i, [])).join('') : '');
}

function pintar(cats, sede, aviso) {
  const activos = new Set(); let fijo = null;
  const dests = cats.filter(c => !c.adic).flatMap(c => c.items).filter(i => i.destacado).sort((a, b) => a.fila - b.fila).slice(0, 4);
  document.title = `Menú · Bakery Bites ${SEDES[sede]}`;
  app.innerHTML =
    `<header><h1>BAKERY BITES</h1><p class="sede">${SEDES[sede]}<a href="./">Cambiar sede</a></p></header>` +
    (aviso ? `<div class="aviso">${esc(aviso)}</div>` : '') +
    (dests.length ? `<div class="destacado" role="region" aria-label="Destacados"><div class="dst-track">` +
      dests.map((d, n) => `<div class="dst-slide${n ? '' : ' on'}" data-uid="${d.uid}"${n ? ' aria-hidden="true"' : ''}><div class="k">Destacado</div><h2>${esc(d.nombre)}</h2>` +
        (d.desc ? `<p>${esc(d.desc)}</p>` : '') +
        `<div class="p">${d.precios.map(p => `<span style="white-space:nowrap">${(p.tamano ? esc(p.tamano) + ' ' : '') + precio(p.precio)}</span>`).join(' · ')}</div></div>`).join('') +
      `</div>${dests.length > 1 ? `<div class="dots">${dests.map((d, n) => `<button class="${n ? '' : 'on'}" data-n="${n}" aria-label="Destacado ${n + 1}"></button>`).join('')}</div>` : ''}</div>` : '') +
    `<div class="chips" role="group" aria-label="Filtros">${Object.entries(ETQ).map(([k, v]) => `<button class="chip" data-t="${k}" aria-pressed="false"><span class="ic">${k}</span>${v}</button>`).join('')}</div>` +
    `<nav><div class="scroll" id="nav"></div></nav><main id="secs"></main>` +
    `<footer>Precios incluyen impoconsumo · K = miles de pesos</footer>`;

  const nav = document.getElementById('nav'), secs = document.getElementById('secs');
  function render() {
    let html = '', links = '';
    cats.forEach(c => {
      const items = c.adic ? c.items : c.items.filter(i => [...activos].every(t => i.tags.includes(t)));
      if (!items.length) return;
      links += `<a href="#${c.id}" data-id="${c.id}">${esc(c.nombre)}</a>`;
      if (c.adic) {
        html += `<section id="${c.id}" class="adic"><h2>${esc(c.nombre)}</h2>` +
          items.map(i => `<div class="adi"><span>${esc(i.nombre)}</span><span class="lead"></span><span class="price">+${precio(i.precios[0].precio)}</span></div>`).join('') + `</section>`;
        return;
      }
      html += `<section id="${c.id}"><h2>${esc(c.nombre)}</h2>`;
      const subs = [];
      items.forEach(i => { let g = subs.find(s => s.nombre === i.sub); if (!g) subs.push(g = { nombre: i.sub, items: [] }); g.items.push(i); });
      subs.forEach(g => {
        if (g.nombre) html += `<h3 class="sub">${esc(g.nombre)}</h3>`;
        html += bloque(g.items, c.cmp, sede === 'SRF' && c.id === 'c-bebidas-calientes' ? OZ : null);
      });
      html += `</section>`;
    });
    nav.innerHTML = links;
    secs.innerHTML = html || `<p class="vacio">No hay productos con esos filtros.</p>`;
    marcar();
  }
  function marcar() {
    const as = nav.querySelectorAll('a'); let cur = as[0];
    as.forEach(a => { const s = document.getElementById(a.dataset.id); if (s && s.getBoundingClientRect().top < 120) cur = a; });
    if (fijo && as.length) cur = [...as].find(a => a.dataset.id === fijo) || cur;
    else if (scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = as[as.length - 1];
    as.forEach(a => a.classList.toggle('on', a === cur));
    if (cur && nav.scrollWidth > nav.clientWidth) {
      const l = cur.offsetLeft - nav.offsetLeft;
      if (l < nav.scrollLeft || l + cur.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollTo({ left: l - 12 });
    }
  }
  app.querySelector('.chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const t = b.dataset.t, on = !activos.has(t);
    on ? activos.add(t) : activos.delete(t);
    b.setAttribute('aria-pressed', on);
    render();
  });
  nav.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    fijo = a.dataset.id; marcar();
    document.getElementById(a.dataset.id).scrollIntoView({ behavior: 'smooth' });
  });
  const soltar = () => { fijo = null; };
  addEventListener('touchstart', soltar, { passive: true });
  addEventListener('wheel', soltar, { passive: true });
  let tk; addEventListener('scroll', () => { cancelAnimationFrame(tk); tk = requestAnimationFrame(marcar); }, { passive: true });
  let tipEl = null;
  const cerrarTip = () => { if (tipEl) { tipEl.remove(); tipEl = null; } };
  secs.addEventListener('click', e => {
    const ic = e.target.closest('.ic');
    if (ic) {
      e.stopPropagation();
      const ya = tipEl && tipEl.parentNode === ic; cerrarTip();
      if (!ya) { tipEl = document.createElement('span'); tipEl.className = 'tip'; tipEl.textContent = ic.dataset.tip; ic.appendChild(tipEl); setTimeout(cerrarTip, 2500); }
      return;
    }
    cerrarTip();
    const it = e.target.closest('.item');
    if (it && it.querySelector('.desc')) it.classList.toggle('open');
  });
  addEventListener('scroll', cerrarTip, { passive: true });
  render();
  const dst = app.querySelector('.destacado');
  if (dst) {
    const slides = dst.querySelectorAll('.dst-slide'), dots = dst.querySelectorAll('.dots button');
    const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let cur = 0, tm = null, x0 = null, y0 = 0, swiped = false;
    const ir = n => {
      cur = (n + slides.length) % slides.length;
      slides.forEach((s, k) => { s.classList.toggle('on', k === cur); s.toggleAttribute('aria-hidden', k !== cur); });
      dots.forEach((d, k) => d.classList.toggle('on', k === cur));
    };
    const programar = ms => {
      clearTimeout(tm);
      if (slides.length > 1 && !quieto) tm = setTimeout(() => { ir(cur + 1); programar(5000); }, ms);
    };
    dst.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; swiped = false; programar(10000); }, { passive: true });
    dst.addEventListener('touchend', e => {
      if (x0 == null || slides.length < 2) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; ir(cur + (dx < 0 ? 1 : -1)); programar(10000); }
    });
    dst.addEventListener('click', e => {
      if (swiped) { swiped = false; return; }
      programar(10000);
      const dot = e.target.closest('.dots button');
      if (dot) { ir(+dot.dataset.n); return; }
      const uid = slides[cur].dataset.uid;
      let el = secs.querySelector(`.item[data-uid="${uid}"]`);
      if (!el && activos.size) {
        activos.clear(); app.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', 'false')); render();
        el = secs.querySelector(`.item[data-uid="${uid}"]`);
      }
      if (!el) return;
      el.classList.add('open');
      el.scrollIntoView({ behavior: quieto ? 'auto' : 'smooth', block: 'center' });
    });
    programar(5000);
  }
}

(async () => {
  const sede = (new URLSearchParams(location.search).get('sede') || '').toUpperCase();
  if (!SEDES[sede]) return elegirSede();
  document.documentElement.classList.add(sede.toLowerCase());
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const d = await cargar();
  if (!d) { app.innerHTML = `<header><h1>BAKERY BITES</h1></header><p class="vacio">No pudimos cargar el menú. Intenta de nuevo en un momento.</p>`; return; }
  let cats;
  try { cats = agrupar(parseCSV(d.text), sede); } catch (e) { cats = []; }
  if (!cats.length) { app.innerHTML = `<header><h1>BAKERY BITES</h1></header><p class="vacio">No pudimos cargar el menú.</p>`; return; }
  pintar(cats, sede, d.aviso);
})();
</script>
